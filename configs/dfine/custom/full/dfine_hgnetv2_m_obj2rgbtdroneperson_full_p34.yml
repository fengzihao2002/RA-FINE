__include__: [
  '../../../dataset/rgbtdroneperson_paired.yml',
  '../../../runtime.yml',
  '../../include/dataloader.yml',
  '../../include/optimizer.yml',
  '../../include/dfine_hgnetv2.yml',
]

# Final P34 three-stage model:
#   FS-CDAE on P3+P4 only -> IGMRF -> MA-FDR.
# P5 bypasses FS-CDAE because the scale ablation showed that P5 warping
# harms overall AP/AP75 while P3+P4 provides the strongest A-only result.
output_dir: /hy-tmp/output/dfine_m_rgbtdroneperson_full_p34

input_channels: 6
eval_spatial_size: [512, 640]

print_freq: 100
checkpoint_freq: 4

model: DFINE

DFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  ir_identity_init: True

  use_fs_cdae: True
  # Backbone outputs: level 0=P3, level 1=P4, level 2=P5.
  # Only P3 and P4 are geometrically aligned; P5 is passed through unchanged.
  fs_enabled_levels: [0, 1]
  use_igmrf: True
  use_ma_fdr: True

  # FS-CDAE: safe identity initialization and bounded local offsets.
  fs_reduction: 4
  fs_max_offset_cells: 1.5
  fs_align_strength_init: 0.10
  fs_align_gate_init: 0.10
  fs_padding_mode: border
  fs_align_corners: False

  # IGMRF: efficient two-modality spatial attention with log reliability bias.
  igmrf_attention_dim: 64
  igmrf_reliability_bias_scale: 0.50
  igmrf_residual_strength_init: 0.05

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: False

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67
  use_modal_side_paths: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1
  use_ma_fdr: True

  # MA-FDR is bounded and baseline preserving (gamma is zero initialized).
  ma_temperature: 1.5
  ma_edge_gate_limit: 0.75
  ma_residual_clip: 3.0
  ma_max_gamma: 0.50
  ma_reliability_prior_scale: 0.50

DFINECriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_fs_offset: 0.02
    loss_fs_smooth: 0.01
    loss_ma_balance: 0.02
    loss_ma_residual: 0.001
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  use_ma_ddf: True
  ma_balance_warmup_epochs: 12

  # NWD support is implemented but deliberately disabled in the main Full
  # configuration, so the three proposed modules remain cleanly attributable.
  use_nwd_aux: False
  nwd_constant: 0.05

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00000625
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00000625
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder|fs_cdae|igmrf))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0000625
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 56

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [512, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

      policy:
        name: stop_epoch
        epoch: 48
        ops:
          - RandomPhotometricDistort
          - RandomZoomOut
          - RandomIoUCrop

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 48
    ema_restart_decay: 0.9999

  shuffle: True
  total_batch_size: 8
  num_workers: 4

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [512, 640]}

  shuffle: False
  total_batch_size: 16
  num_workers: 4

use_amp: True
use_ema: True

ema:
  warmups: 0

# Two epochs of gentle warm-up on typical RGBTDronePerson iteration counts.
lr_warmup_scheduler:
  warmup_duration: 1000
